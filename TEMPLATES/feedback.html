<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            max-width: 700px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .contador {
            color: #555;
            margin-bottom: 20px;
        }

        .correcta {
            color: #15803d;
            font-size: 36px;
            font-weight: bold;
        }

        .incorrecta {
            color: #b91c1c;
            font-size: 36px;
            font-weight: bold;
        }

        .respuesta {
            font-size: 22px;
            margin-top: 20px;
        }

        button {
            margin-top: 30px;
            padding: 15px 30px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <div class="contador">
        Pregunta {{ numero }}/{{ total }}
    </div>

    {% if correcta %}
        <div class="correcta">✅ Correcta</div>
    {% else %}
        <div class="incorrecta">❌ Incorrecta</div>

        <div class="respuesta">
            La correcta era:
            <strong>{{ respuesta_correcta }}</strong>
        </div>
    {% endif %}

    <a href="/siguiente">
        <button>Siguiente pregunta</button>
    </a>

</div>

</body>
