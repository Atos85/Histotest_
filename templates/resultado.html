<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado final</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="light">

<div class="contenedor">

    <h1>Test terminado</h1>

    <h2>{{ aciertos }} aciertos de {{ total }}</h2>

    {% if fallos %}

        <h3>Preguntas falladas</h3>

        {% for fallo in fallos %}
            <div class="fallo">
                <p><strong>{{ fallo.pregunta }}</strong></p>
                <p>Tu respuesta: {{ fallo.tu }}</p>
                <p>Correcta: {{ fallo.correcta }}</p>
            </div>
        {% endfor %}

        <a href="/repetir-falladas">
            <button>Repetir preguntas falladas</button>
        </a>

    {% else %}

        <p class="sinfallos">
            Perfecto. No has fallado ninguna pregunta.
        </p>

    {% endif %}

    <a href="/">
        <button>Volver al inicio</button>
    </a>

</div>

</body>
</html>
