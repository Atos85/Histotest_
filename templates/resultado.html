<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado final</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #1f2937;
        }

        .nota {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 25px 0;
            color: #1f4e79;
        }

        .fallo {
            border-left: 6px solid #b91c1c;
            background: #fff1f2;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
        }

        .sinfallos {
            text-align: center;
            font-size: 20px;
            color: #15803d;
        }

        button {
            display: block;
            margin: 30px auto 0;
            padding: 15px 30px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <h1>Test terminado</h1>

    <div class="nota">
        {{ aciertos }} aciertos de {{ total }}
    </div>

    {% if fallos %}
        <h2>Preguntas falladas</h2>

        {% for fallo in fallos %}
            <div class="fallo">
                <p><strong>{{ fallo.pregunta }}</strong></p>
                <p>Tu respuesta: {{ fallo.tu }}</p>
                <p>Correcta: {{ fallo.correcta }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p class="sinfallos">Perfecto. No has fallado ninguna pregunta.</p>
    {% endif %}


    <a href="/repetir-falladas">
        <button>
            Repetir preguntas falladas
        </button>
    </a>
{% endif %}
    </a>
